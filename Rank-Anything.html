 *

 * Tiers repeatedly remove the maximal elements of the resulting strict relation.

    var items = array(field(input, 'items', path), path + '.items', LIMITS.itemsPerCollection);
    var ids = new Set();
    var names = new Set();
    for (var i = 0; i < items.length; i++) {
      var itemPath = path + '.items[' + i + ']';
      record(items[i], itemPath);
      var itemId = identifier(field(items[i], 'id', itemPath), itemPath + '.id');
      var itemName = name(field(items[i], 'name', itemPath), itemPath + '.name');
      if (ids.has(itemId)) fail(itemPath + '.id', 'duplicates another item ID in this collection.');
      if (names.has(nameKey(itemName)))
        fail(
          itemPath + '.name',
          'duplicates another item name in this collection (ignoring case).',
        );
      ids.add(itemId);
      names.add(nameKey(itemName));
      output.items.push({ id: itemId, name: itemName });
    }
    var ballots = array(
      field(input, 'ballots', path),
      path + '.ballots',
      LIMITS.ballotsPerCollection,
    );
    var ballotIds = new Set();

      var ballotPath = path + '.ballots[' + b + ']';
      var ballot = ballots[b];
      record(ballot, ballotPath);
      var ballotId = identifier(field(ballot, 'id', ballotPath), ballotPath + '.id');
      if (ballotIds.has(ballotId))
        fail(ballotPath + '.id', 'duplicates another ballot ID in this collection.');

      var createdAt = timestamp(field(ballot, 'createdAt', ballotPath), ballotPath + '.createdAt');
      var groups = array(
        field(ballot, 'groups', ballotPath),
        ballotPath + '.groups',
        LIMITS.historicalBatchSize,
      );
      if (!groups.length) fail(ballotPath + '.groups', 'must contain at least one ranked group.');
      var seen = new Set();
      var cleanGroups = [];
      var rankedCount = 0;
      for (var g = 0; g < groups.length; g++) {
        var groupPath = ballotPath + '.groups[' + g + ']';
        var group = array(groups[g], groupPath, LIMITS.historicalBatchSize);
        if (!group.length) fail(groupPath, 'cannot be empty.');
        var cleanGroup = [];
        for (var r = 0; r < group.length; r++) {
          var ref = identifier(group[r], groupPath + '[' + r + ']');
          if (!ids.has(ref)) fail(groupPath, 'refers to an unknown item ID: ' + ref + '.');
          if (seen.has(ref)) fail(groupPath, 'ranks the same item more than once: ' + ref + '.');

        field(ballot, 'skipped', ballotPath),
        ballotPath + '.skipped',
        LIMITS.historicalBatchSize,

        fail(
          ballotPath,
          'cannot include more than ' +
            LIMITS.historicalBatchSize +
            ' ranked and skipped items combined.',
        );
      var cleanSkipped = [];
      for (var s = 0; s < skipped.length; s++) {
        var skippedRef = identifier(skipped[s], ballotPath + '.skipped[' + s + ']');
        if (!ids.has(skippedRef))
          fail(ballotPath + '.skipped', 'refers to an unknown item ID: ' + skippedRef + '.');
        if (seen.has(skippedRef))
          fail(ballotPath + '.skipped', 'duplicates a ranked or skipped item: ' + skippedRef + '.');
        seen.add(skippedRef);
        cleanSkipped.push(skippedRef);
      }
      output.ballots.push({
        id: ballotId,
        createdAt: createdAt,
        groups: cleanGroups,
        skipped: cleanSkipped,
      });
    }
    return output;
  }

  function validateBackup(input) {
    record(input, 'Backup');
    if (field(input, 'version', 'Backup') !== 1)
      fail('Backup.version', 'must be 1; this backup version is not supported.');
    var collections = array(
      field(input, 'collections', 'Backup'),
      'Backup.collections',
      LIMITS.collections,
    );
    var result = { version: 1, collections: [] };
    var ids = new Set();
    var totalItems = 0;
    var totalBallots = 0;
    for (var i = 0; i < collections.length; i++) {
      var path = 'Backup.collections[' + i + ']';
      var collection = validateCollection(collections[i], path);
      if (ids.has(collection.id)) fail(path + '.id', 'duplicates another collection ID.');
      ids.add(collection.id);
      totalItems += collection.items.length;
      totalBallots += collection.ballots.length;
      if (totalItems > LIMITS.totalItems)
        fail(
          'Backup.collections',
          'cannot contain more than ' + LIMITS.totalItems + ' items in total.',
        );
      if (totalBallots > LIMITS.totalBallots)

          'Backup.collections',
          'cannot contain more than ' + LIMITS.totalBallots + ' ballots in total.',
        );

    }

    return result;
  }

  function evidence(collection) {
    var size = collection.items.length;
    var indices = new Map();
    collection.items.forEach(function (item, index) {
      indices.set(item.id, index);
    });
    var wins = new Float64Array(size * size);
    var observations = new Float64Array(size * size);
    var itemObservations = new Float64Array(size);
    var comparisons = 0;
    collection.ballots.forEach(function (ballot) {
      var ranked = [];
      ballot.groups.forEach(function (group, tier) {
        group.forEach(function (id) {
          ranked.push({ index: indices.get(id), tier: tier });
        });
      });

        for (var b = a + 1; b < ranked.length; b++) {
          var first = ranked[a];
          var second = ranked[b];
          observations[first.index * size + second.index]++;
          observations[second.index * size + first.index]++;
          itemObservations[first.index]++;
          itemObservations[second.index]++;
          comparisons++;
          if (first.tier < second.tier) wins[first.index * size + second.index]++;
          else if (second.tier < first.tier) wins[second.index * size + first.index]++;

    });
    return {
      size: size,
      wins: wins,
      observations: observations,
      itemObservations: itemObservations,
      comparisons: comparisons,
    };
  }

  function majorityHasCycle(wins, size) {
    var incoming = new Uint32Array(size);
    for (var i = 0; i < size; i++) {
      for (var j = 0; j < size; j++) if (wins[i * size + j] > wins[j * size + i]) incoming[j]++;
    }
    var ready = [];
    for (var n = 0; n < size; n++) if (incoming[n] === 0) ready.push(n);
    var processed = 0;
    while (processed < ready.length) {
      var node = ready[processed++];
      for (var next = 0; next < size; next++) {
        if (wins[node * size + next] > wins[next * size + node] && --incoming[next] === 0)
          ready.push(next);
      }
    }
    return processed !== size;
  }

  function aggregate(input) {
    var collection = validateCollection(input, 'Collection');
    var data = evidence(collection);
    var size = data.size;
    var paths = new Float64Array(size * size);
    var pairwise = Object.create(null);
    var uncompared = [];
    var remaining = [];
    var observedPairs = 0;
    for (var i = 0; i < size; i++) {
      var row = Object.create(null);
      pairwise[collection.items[i].id] = row;
      for (var j = 0; j < size; j++) {
        row[collection.items[j].id] = data.wins[i * size + j];
        if (data.wins[i * size + j] > data.wins[j * size + i])
          paths[i * size + j] = data.wins[i * size + j];
        if (j > i && data.observations[i * size + j] > 0) observedPairs++;
      }
      if (data.itemObservations[i] === 0) uncompared.push(collection.items[i].id);
      else remaining.push(i);
    }
    // Floyd–Warshall over the max/min semiring: the strongest path's weakest edge.
    for (var pivot = 0; pivot < size; pivot++) {
      for (var from = 0; from < size; from++) {
        if (from === pivot || paths[from * size + pivot] === 0) continue;
        for (var to = 0; to < size; to++) {
          if (to === pivot || to === from) continue;
          var through = Math.min(paths[from * size + pivot], paths[pivot * size + to]);
          if (through > paths[from * size + to]) paths[from * size + to] = through;
        }
      }
    }
    var tiers = [];
    while (remaining.length) {
      var maximal = remaining.filter(function (candidate) {
        return !remaining.some(function (other) {
          return paths[other * size + candidate] > paths[candidate * size + other];
        });
      });
      // Schulze's strict strongest-path relation is acyclic, so this is nonempty.
      if (!maximal.length) throw new Error('Could not resolve the strongest-path ordering.');
      maximal.sort(function (a, b) {
        return (
          collection.items[a].name.localeCompare(collection.items[b].name, 'en', {
            sensitivity: 'base',
            numeric: true,
          }) || a - b
        );
      });
      tiers.push(
        maximal.map(function (index) {
          return collection.items[index].id;
        }),
      );
      var removed = new Set(maximal);
      remaining = remaining.filter(function (index) {
        return !removed.has(index);
      });
    }
    return {
      tiers: tiers,
      uncompared: uncompared,
      pairwise: pairwise,
      comparisons: data.comparisons, // Repeated pair observations, including ties.
      possiblePairs: size < 2 ? 0 : (size * (size - 1)) / 2,
      observedPairs: observedPairs,
      cycles: majorityHasCycle(data.wins, size), // Direct strict-majority graph.
    };
  }

  function chooseBatch(input, limit) {
    if (limit === undefined) limit = LIMITS.batchSize;
    if (!Number.isInteger(limit) || limit < 1 || limit > LIMITS.batchSize) {
      throw new Error('Batch limit must be an integer from 1 to ' + LIMITS.batchSize + '.');
    }
    var collection = validateCollection(input, 'Collection');
    var data = evidence(collection);
    var selected = [];
    var indices = new Map(
      collection.items.map(function (item, index) {
        return [item.id, index];
      }),
    );
    var shown = new Uint32Array(data.size);
    var lastShown = new Int32Array(data.size).fill(-1);
    var lastSkipped = new Int32Array(data.size).fill(-100);
    var lastRanked = new Int32Array(data.size).fill(-100);
    collection.ballots.forEach(function (ballot, round) {
      ballot.groups.flat().forEach(function (id) {
        var i = indices.get(id);
        shown[i]++;
        lastShown[i] = round;
        lastRanked[i] = round;
      });
      ballot.skipped.forEach(function (id) {
        var i = indices.get(id);
        shown[i]++;
        lastShown[i] = round;
        lastSkipped[i] = round;
      });
    });
    var previous = collection.ballots[collection.ballots.length - 1];
    var previousRanked = new Set(
      previous
        ? previous.groups.flat().map(function (id) {
            return indices.get(id);
          })
        : [],
    );
    var previousAll = new Set(
      previous
        ? previous.groups
            .flat()
            .concat(previous.skipped)
            .map(function (id) {
              return indices.get(id);
            })
        : [],
    );
    // A skip affects scheduling only: rest it for the next two saved rounds,
    // when at least two alternatives exist. It never enters ranking evidence.
    var cooling = function (i) {
      return lastSkipped[i] > lastRanked[i] && collection.ballots.length - lastSkipped[i] <= 2;
    };
    var available = collection.items.map(function (_, index) {
      return index;
    });
    var rested = available.filter(function (i) {
      return !cooling(i);
    });
    if (rested.length >= 2) available = rested;
    var target = Math.min(limit, available.length);
    // If all alternatives are resting, vary a full repeated round with a smaller
    // subset rather than immediately reintroducing unfamiliar items.
    if (
      target > 2 &&
      collection.items.length > target &&
      previousAll.size === target &&
      available.length === target &&
      available.every(function (i) {
        return previousAll.has(i);
      })
    )
      target--;
    function take(index) {
      selected.push(index);
      available.splice(available.indexOf(index), 1);
    }
    // One familiar anchor joins rounds into a connected body of evidence.
    // Tiny collections simply use the available items; there is no forced anchor.
    if (collection.items.length > limit && target >= 2) {
      var anchors = available.filter(function (i) {
        return previousRanked.has(i);
      });
      anchors.sort(function (a, b) {
        return data.itemObservations[a] - data.itemObservations[b] || shown[a] - shown[b] || a - b;
      });
      if (anchors.length) take(anchors[0]);
    }
    while (selected.length < target && available.length) {
      var bestPosition = 0;
      var bestScore = null;
      // Guarantee a changed set whenever a non-resting alternative exists.
      var requireFresh =
        previousAll.size &&
        !selected.some(function (i) {
          return !previousAll.has(i);
        }) &&
        available.some(function (i) {
          return !previousAll.has(i);
        });
      available.forEach(function (candidate, position) {
        var newPairs = 0;
        var pairCount = 0;
        selected.forEach(function (other) {
          var count = data.observations[candidate * data.size + other];
          if (count === 0) newPairs++;
          pairCount += count;
        });
        var score = [
          cooling(candidate) ? 1 : 0,
          requireFresh && previousAll.has(candidate) ? 1 : 0,
          -newPairs,
          pairCount,
          data.itemObservations[candidate],
          shown[candidate],
          lastShown[candidate],
          candidate,
        ];
        for (var k = 0; k < score.length; k++) {
          if (bestScore === null || score[k] < bestScore[k]) {
            bestScore = score;
            bestPosition = position;
            break;
          }
          if (score[k] > bestScore[k]) break;
        }
      });
      take(available[bestPosition]);
    }
    return selected.map(function (index) {
      return collection.items[index].id;
    });
  }

  return Object.freeze({
    LIMITS: LIMITS,
    nameKey: nameKey,
    validateBackup: validateBackup,
    aggregate: aggregate,
    chooseBatch: chooseBatch,
  });
});

                }
                state = candidate;
                persist();
                render('rename-collection');
              },
              { label: 'Save name', inputValue: c.name },
            ),
          'link',
          { id: 'rename-collection' },
        ),
        btn(
          'Delete collection',
          () =>
            dialog(
              'Delete this collection?',
              'All ' +
                c.items.length +
                ' items and ' +
                c.ballots.length +
                ' ballots in “' +
                c.name +
                '” will be removed, along with any unadded item names for this collection. This cannot be undone here. Export a backup first if you may want it back.',
              () => {
                state.collections = state.collections.filter((x) => x.id !== c.id);
                selected = state.collections[0]?.id || null;
                draft = null;
                savedRound = null;
                if (persist()) pendingItemInputs.delete(c.id);
                render('view-heading');
              },
              { label: 'Delete collection', danger: true },
            ),
          'link danger',
        ),
      ),
    );
    return section;
  }
  function historyView(c) {
    if (!c.ballots.length)
      return el(
        'div',
        { class: 'panel empty' },
        el('h2', { id: 'history-heading', tabindex: '-1' }, 'Every preference has a history'),
        el(
          'p',
          { class: 'muted' },
          'Your saved ballots will appear here. Remove any ballot to undo its contribution.',
        ),
      );
    historyPage = Math.min(historyPage, Math.ceil(c.ballots.length / 50) - 1);
    const offset = historyPage * 50;
    return el(
      'div',
      {},
      el('h2', { id: 'history-heading', tabindex: '-1' }, 'Your ballots'),
      el(
        'p',
        { class: 'muted', style: 'font-size:13px' },
        'Each ballot counts once. Deleting a ballot immediately recalculates the results.',
      ),
      el(
        'div',
        { class: 'row wrap', style: 'margin-bottom:18px' },
        el(
          'span',
          { class: 'muted' },
          'Page ' + (historyPage + 1) + ' of ' + Math.ceil(c.ballots.length / 50),
        ),
        el(
          'div',
          { class: 'actions' },
          btn(
            'Newer',
            () => {
              historyPage--;
              render(['history-newer', 'history-older']);
            },
            'small',
            { id: 'history-newer', disabled: historyPage === 0 },
          ),
          btn(
            'Older',
            () => {
              historyPage++;
              render(['history-older', 'history-newer']);
            },
            'small',
            { id: 'history-older', disabled: offset + 50 >= c.ballots.length },
          ),
        ),
      ),
      [...c.ballots]
        .reverse()
        .slice(offset, offset + 50)
        .map((b, i) =>
          el(
            'div',
            { class: 'panel' },
            el(
              'div',
              { class: 'row' },
              el('span', { class: 'badge' }, 'Ballot ' + (c.ballots.length - offset - i)),
              el('span', { class: 'history-date' }, new Date(b.createdAt).toLocaleString()),
            ),
            el(
              'div',
              { class: 'history-groups' },
              b.groups.map((g) => g.map(name).join(' = ')).join('  ›  '),
            ),
            b.skipped.length
              ? el(
                  'p',
                  { class: 'muted history-skipped', style: 'font-size:12px' },
                  'Skipped: ' + b.skipped.map(name).join(', '),
                )
              : null,
            btn(
              i === 0 && offset === 0 ? 'Undo this ballot' : 'Delete ballot',
              () =>
                dialog(
                  'Remove this ballot?',
                  'Its comparisons will no longer contribute to your results.',
                  () => {
                    c.ballots = c.ballots.filter((x) => x.id !== b.id);
                    persist();
                    render('history-heading');
                    notify('Ballot removed; ranking recalculated.');
                  },
                  { label: 'Remove ballot', danger: true },
                ),
              'small danger',
            ),
          ),
        ),
    );
  }
  function helpView() {
    return el(
      'div',
      { class: 'panel help' },
      el('h2', {}, 'A little room for nuance'),
      [
        [
          'Preference, not a score',
          'This is your evolving order of preference. No stars, grades, or claims of objective quality. Separate collections keep different subjects and their results independent. Each saved ballot has equal weight; repeated ballots add more evidence, so undo old ballots if you want to replace an opinion.',
        ],
        [
          'How a ballot works',
          'A batch contains up to five items. Use ↑ and ↓ to move an item; with a tied item, the arrows split it into a separate rank. “Tie ↑” joins the rank above. Use Choose items to select 2–5 familiar items yourself, including items that have not appeared in an automatic batch. The top is most preferred. Automatic rounds start in a random order; chosen rounds follow your selection order. Review both before saving. Skip anything unfamiliar or anything you cannot compare today. Skips never become losses. You need at least two ranked items.',
        ],
        [
          'Keep going in small rounds',
          'After saving, choose Next round for up to five items. A familiar item helps connect rounds, while new pairs and less-compared items get priority. With small collections, some items naturally repeat. Skipped items rest for two saved rounds when alternatives exist; rounds may be smaller during that rest. Skips never count as losses or permanently hide an item. Choose items always lets you bring anything back. Older backups with up to ten items per ballot still work.',
        ],
        [
          'What about A > B > C > A?',
          'Cycles are normal in preference data. The app uses the Schulze method (winning-votes variant): it compares the strongest paths of pairwise majority support, rather than pretending every ballot fits a simple score. If neither direction is stronger, the evidence does not resolve that pair. Maximal remaining items are shown in a shared tier, alphabetically. This can reflect explicit ties, a cycle, or missing comparisons. Shared tiers do not prove equal preference.',
        ],
        [
          'Partial evidence stays visible',
          'Items with zero pair comparisons stay under “Not ranked yet”, separate from the ordering. An explicit tied comparison counts as evidence but gives neither item a win. Pair coverage tells you how much of the collection has met; it is not a confidence score. Disconnected groups can share unresolved tiers. More ballots can change any provisional order.',
        ],
        [
          'Keep a backup',
          'Your data lives in this browser, on this device, when browser storage is available. Nothing is uploaded, synced, or shared. Private browsing, clearing browser data, moving the app files, or switching browsers may lose or separate your saved state. Export JSON backups regularly and before deleting data. Import adds separate collections; it never overwrites existing ones. Export includes added items and saved ballots, but not unadded names or a ballot in progress.',
        ],
        [
          'Keyboard & offline use',
          'Use Tab to navigate and Enter or Space to activate buttons. After moving or restoring an item, focus stays on an enabled ranking control for that item. Skipping an item moves focus to its Restore button. Open index.html alongside app.js, engine.js, and style.css in a desktop browser, or use the self-contained Rank-Anything.html file. No server or internet connection is needed. Use one browser tab at a time.',
        ],
      ].map(([title, text]) =>
        el('section', {}, el('h3', {}, title), el('p', { class: 'muted' }, text)),
      ),
    );
  }
  function render(focusIds) {
    if (historyCollectionId !== selected) {
      historyCollectionId = selected;
      historyPage = 0;
    }
    root.replaceChildren();
    const c = collection();
    const file = el('input', {
      type: 'file',
      class: 'file-input',
      accept: '.json,application/json',
      onChange: importBackup,
      'aria-label': 'Import backup',
    });
    const sidebar = el(
      'aside',
      { class: 'sidebar' },
      el(
        'div',
        { class: 'brand' },
        el('span', { class: 'mark', 'aria-hidden': 'true' }, el('i'), el('i'), el('i')),
        'Rank Anything',
      ),
      el(
        'div',
        {},
        el('div', { class: 'eyebrow' }, 'Your collections'),
        el(
          'nav',
          { class: 'collections', 'aria-label': 'Collections' },
          state.collections.map((x) =>
            btn(
              [el('span', {}, x.name), el('small', {}, x.items.length)],
              () => switchCollection(x.id),
              'collection' + (x.id === selected ? ' active' : ''),
              { 'aria-current': x.id === selected ? 'true' : 'false' },
            ),
          ),
        ),
        btn('+ New collection', newCollection, 'new'),
      ),
      el(
        'div',
        { class: 'sidebar-foot' },
        el('div', { class: 'eyebrow' }, 'Yours to keep'),
        el('p', {}, 'A little order for the things\nyou care about.'),
        el(
          'div',
          { class: 'side-actions' },
          btn('Export backup', exportBackup),
          btn('Import backup', () => file.click()),
        ),
        file,
        el('span', {}, 'Offline · No account · No tracking'),
      ),
    );
    const main = el(
      'main',
      { class: 'main' },
      el(
        'div',
        { class: 'topline' },
        el('span', {}, 'A matter of preference'),
        el(
          'span',
          {},
          el('i', { class: 'local-dot' }),
          storageWarning ? 'Export to keep this session' : 'Stored on this device',
        ),
      ),
    );
    if (storageWarning)
      main.append(
        el(
          'div',
          { class: 'notice warning', role: 'alert' },
          storageWarning,
          unreadableSave !== null
            ? el(
                'div',
                { class: 'actions', style: 'margin-top:10px' },
                btn(
                  'Download unreadable save',
                  () => download(unreadableSave, 'rank-anything-unreadable-save.txt', 'text/plain'),
                  'small',
                ),
                btn(
                  'Replace previous save',
                  () =>
                    dialog(
                      'Replace unreadable saved data?',
                      'Download the unreadable save first if you may need to recover it. This will replace it with this session’s current collections.',
                      () => {
                        unreadableSave = null;
                        persist();
                        render('view-heading');
                      },
                      { label: 'Replace save', danger: true },
                    ),
                  'small danger',
                ),
              )
            : null,
        ),
      );
    if (!c) {
      main.append(
        el(
          'div',
          { class: 'onboard' },
          el('div', { class: 'eyebrow' }, 'Your taste. Your order.'),
          el(
            'h1',
            { id: 'view-heading', tabindex: '-1' },
            'Rank anything.\nDiscover your favorites.',
          ),
          el(
            'p',
            { class: 'intro muted' },
            'Turn a jumble of good things into a preference order. Compare a handful at a time, leave room for ties, and watch your favorites emerge.',
          ),
          el(
            'div',
            { class: 'welcome-grid' },
            el(
              'div',
              { class: 'panel' },
              el('span', { class: 'badge' }, 'A clean slate'),
              el('h2', { style: 'margin-top:17px' }, 'Make it yours'),
              el(
                'p',
                { class: 'muted' },
                'Start with games, books, films, meals, or a collection of your own.',
              ),
              btn('Create a collection', newCollection, 'primary'),
            ),
            el(
              'div',
              { class: 'panel soft' },
              el('span', { class: 'badge' }, 'Try it first'),
              el('h2', { style: 'margin-top:17px' }, 'A weekend well spent'),
              el(
                'p',
                { class: 'muted' },
                'Explore twelve demo activities. You bring the preferences.',
              ),
              btn('Explore demo', demo),
            ),
          ),
        ),
      );
    } else {
      main.append(
        el('div', { class: 'eyebrow' }, 'Your collection'),
        el('h1', { id: 'view-heading', tabindex: '-1' }, c.name),
        el('p', { class: 'muted' }, 'A living order of the things you prefer.'),
        el(
          'nav',
          { class: 'tabs', 'aria-label': 'Collection views' },
          ['Rank', 'Results', 'Items', 'History', 'Guide'].map((t) =>
            btn(
              t,
              () => {
                tab = t;
                render('tab-' + t);
              },
              t === tab ? 'active' : '',
              { id: 'tab-' + t, 'aria-current': t === tab ? 'page' : 'false' },
            ),
          ),
        ),
      );
      main.append(
        tab === 'Rank'
          ? rankView(c)
          : tab === 'Results'
            ? resultsView(c)
            : tab === 'Items'
              ? itemsView(c)
              : tab === 'History'
                ? historyView(c)
                : helpView(),
      );
    }
    main.append(el('footer', {}, 'Rank Anything · Preferences change. Your ranking can, too.'));
    root.append(el('div', { class: 'shell' }, sidebar, main));
    if (focusIds !== undefined) focusContent(focusIds);
  }
  window.addEventListener('beforeunload', (e) => {
    if (draft || storageWarning || [...pendingItemInputs.values()].some((value) => value.trim())) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
  window.addEventListener('storage', (e) => {
    if (e.key === KEY)
      notify(
        'Data changed in another tab. Export this tab if needed, then reload before editing to avoid overwriting it.',
      );
  });
  render();
})();
</script>
  </body>
</html>
